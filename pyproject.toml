[project]
name = "shopstream-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "voyageai",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "mcp[cli]",
]

[project.scripts]
shopstream = "shopstream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopstream"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
